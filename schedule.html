<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Schedule</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link href="images/BCITM.ico" rel="icon" type="image/x-icon">
</head>

<body class="body">
    <div id="navcontainer">
        <nav>
            <div class="topnav">
                <ul>
                    <li><a href="./main.html">Home</a></li>
                    <li><a>Notifications</a></li>
                    <li><a href="./schedule.html">Schedule</a></li>
                    <li><a href="./settings.html">Settings</a></li>
                    <li><a href="./index.html">Log Out</a></li>
                </ul>
            </div>
        </nav>
    </div>
    <main id="schedule-main">
        <div class="header">
            <h1>Upload Schedule</h1>
            <p>Upload a .csv file to build a schedule table.</p>
        </div>
        <div class="importcontainer">
            <input type="file" id="csvFileInput" class="hidden-button" accept=".csv">
            <label style="font-weight: bold;" for="csvFileInput" class="custom-button"><span id="upload-button" style="font-weight: bold;">Upload Schedule</span></label>
        </div>
        <div>
            <button type="button" id="deleteSchedule">
                <img id="trash-icon" src=/images/trash_icon.png alt="trash icon"> Delete Schedule
            </button>
        </div>
        <div id="tableContainer"></div>
    </main>


    <script type="module" src="./src/schedule.js"></script>
</body>
</html>
